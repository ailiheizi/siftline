[project]
name = "siftline"
version = "0.2.0"
description = "Thin, scriptable search/fetch sensor CLI for AI agents and skills. GitHub via gh CLI, Hacker News Algolia, Exa, Tavily, and OpenAI-compatible web_search. No LLM reasoning inside the CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "siftline contributors" }]
keywords = ["cli", "search", "github", "hacker-news", "llm", "skill", "sensor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "rich>=13,<15",
    "pydantic>=2.7,<3",
    "platformdirs>=4,<5",
]

[project.scripts]
siftline = "siftline.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siftline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W", "C4"]
ignore = ["B008"]

[tool.mypy]
files = ["src/siftline"]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: read-only live smoke tests that require network access and/or an authenticated gh CLI",
]
